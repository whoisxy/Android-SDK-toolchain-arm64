name: Reusable dependency build and release
on:
  workflow_call:
    inputs:
      dependency:
        type: string
        required: true
      ref:
        type: string
        default: ''
      source_url:
        type: string
        default: ''
      libc:
        type: string
        default: bionic
      runner:
        type: string
        default: ''
      release_repository:
        type: string
        default: ''
    secrets:
      RELEASE_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
      repository: ${{ steps.plan.outputs.repository }}
      compiler_required: ${{ steps.plan.outputs.compiler_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        name: Resolve dependency, runner and release destination
        env:
          DEPENDENCY: ${{ inputs.dependency }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_URL: ${{ inputs.source_url }}
          RUNNER_LABELS: ${{ inputs.runner }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          TARGET_LIBC: ${{ inputs.libc }}
        run: python3 scripts/plan.py "$DEPENDENCY" --ref "$REQUESTED_REF" --source-url "$SOURCE_URL" --runner "$RUNNER_LABELS" --repository "$RELEASE_REPOSITORY" --libc "$TARGET_LIBC"
  build:
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reclaim hosted runner space for the Dart and Flutter source build
        if: runner.environment == 'github-hosted' && contains(fromJSON('["gen-snapshot","dart-sdk","flutter-tools","flutter-engine-arm64"]'), inputs.dependency)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Install build prerequisites
        env:
          DEPENDENCY: ${{ inputs.dependency }}
        run: bash scripts/install-host-deps.sh "$DEPENDENCY"
      - name: Install ARM64 target toolchain
        if: needs.plan.outputs.compiler_required == 'true'
        env:
          TARGET_LIBC: ${{ inputs.libc }}
        run: python3 scripts/install-target-toolchain.py "$TARGET_LIBC"
      - name: Build selected dependency and package output
        env:
          DEPENDENCY: ${{ inputs.dependency }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_URL: ${{ inputs.source_url }}
          BUILD_ROOT: ${{ runner.temp }}/dependency-build-${{ github.run_id }}-${{ github.run_attempt }}
          JOBS: '4'
          TARGET_LIBC: ${{ inputs.libc }}
        run: |
          set -o pipefail
          log="$(mktemp)"
          marker="$(openssl rand -hex 24)"
          printf '::stop-commands::%s\n' "$marker"
          result=0
          bash scripts/build.sh "$DEPENDENCY" "$REQUESTED_REF" --source-url "$SOURCE_URL" --libc "$TARGET_LIBC" 2>&1 | tee "$log" || result=$?
          printf '::%s::\n' "$marker"
          if (( result == 0 )); then
            exit 0
          fi
          failure="$(tail -n 25 "$log")"
          failure="${failure//'%'/'%25'}"
          failure="${failure//$'\r'/'%0D'}"
          failure="${failure//$'\n'/'%0A'}"
          printf '::error::%s\n' "$failure"
          exit 1
      - name: Pass completed outputs to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ inputs.dependency }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-${{ inputs.dependency }}
          path: release-assets
      - name: Create release, upload output assets, then publish
        env:
          GH_TOKEN: ${{ needs.plan.outputs.repository == github.repository && github.token || secrets.RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          DEPENDENCY: ${{ inputs.dependency }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_URL: ${{ inputs.source_url }}
          TARGET_LIBC: ${{ inputs.libc }}
        run: python3 scripts/release.py release-assets --repository "$RELEASE_REPOSITORY" --dependency "$DEPENDENCY" --libc "$TARGET_LIBC" --source-url "$SOURCE_URL" --ref "$REQUESTED_REF"
